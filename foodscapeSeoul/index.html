<!DOCTYPE html>

<html>
<head>
    <meta charset="utf-8">
	<title>Seoul FoodScape</title>
	
	
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
    <script type="text/javascript" src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <script type="text/javascript" src="../lib/d3.v3.min.js"></script>

    <script type="text/javascript" src="data_matrix.js"></script>
    <script type="text/javascript">
        
        var sites = readSites();
        var centerXY = readXY();
        var colors = readColors();

        var data = new Array();
        
        function Data(lat, lng) {
            this.lat = lat;
            this.lng = lng;
        }
        
        var dataColor = new Array();

        ReReadSites();
        ReReadColors();

        var stColor, flColor;
        var circleScale = 50;        
        
        var map;

        function initialize() {

            // MapLibre + Carto Voyager (API key 불필요)
            map = new maplibregl.Map({
                container: "map_canvas",
                style: "https://basemaps.cartocdn.com/gl/voyager-gl-style/style.json",
                center: [126.981805, 37.538527],
                zoom: 12
            });
            map.addControl(new maplibregl.NavigationControl(), "bottom-left");

            map.on("load", function () {

                applyKoreanLabels();

                DrawBackground();

                DrawPolygon();
            });

            DrawPieChart();


        } //initialize()

        function applyKoreanLabels() {
            map.getStyle().layers.forEach(function (layer) {
                var field = layer.layout && layer.layout["text-field"];
                if (layer.type === "symbol" && field && JSON.stringify(field).indexOf("name") >= 0) {
                    map.setLayoutProperty(layer.id, "text-field", ["coalesce", ["get", "name:ko"], ["get", "name"]]);
                }
            });
        }


        function DrawPieChart() {

            var txt = d3.select("body").append("text");

            txt.text("Seoul Foodscape")
                .attr("id", "title");

            //Width and height
            var w = 400;
            var h = 400;

            var dataset = [35000, 4072, 967, 3148, 10172, 12454, 6317, 1112, 5316, 4941];
            var dataTxt = ["Korean", "Chinese", "Asian Fusion", "Western","Cafe", "Bar", "Chicken", "Fastfood", "Snack", "Japanese"];
            var color = ["#c00000", "#ff8c00", "#ffff00", "#92d14f", "#00af50", "#0070c0", "#000000", "#012060", "#7030a0", "#ff1493"];

            var outerRadius = 90;
            var innerRadius = 40;
            var arc = d3.svg.arc()
							.innerRadius(innerRadius)
							.outerRadius(outerRadius);

            var pie = d3.layout.pie()
                    .sort(null);

            

            //Create SVG element
            var svg = d3.select("body")
						.append("svg")
						.attr("width", w)
						.attr("height", h);

            //Set up groups
            var arcs = svg.selectAll("g.arc")
						  .data(pie(dataset))
						  .enter()
						  .append("g")
						  .attr("class", "arc")
						  .attr("transform", "translate(" + outerRadius*1.2 + "," + outerRadius*1.1 + ")");   

            //Draw arc paths
            arcs.append("path")
			    .attr("fill", function (d, i) {
			        return color[i];
			    })
			    .attr("d", arc);

            //Labels
            arcs.append("text")
                .attr("dy", ".35em")
			    .attr("transform", function (d,i) {
			        var arcCentroid = arc.centroid(d);
			        if (i == 2 | i == 7) {
			            return "translate(" + arcCentroid[0] * 1.5 + "," + arcCentroid[1] * 1.5 + ")rotate(" + (angle(d)-90)+ ")";
			        } else {
			            return "translate(" + arcCentroid[0] + "," + arcCentroid[1]  + ")rotate(" + (angle(d)) + ")";
			        }
			        
			    })
			    .attr("text-anchor", function (d, i) {
			        if (i == 2 | i == 7) {
			            return "middle";
			        } else {
			            return "middle";
			        }
			    })
                .style("fill",function (d,i) {
                    if (i == 2 | i == 7) {
                        return "black";
                    } else {
                        return "white";
                    }
                })
			    .text(function (d,i) {
			        return dataTxt[i];
			    });

            function angle(d) {
                var a = (d.startAngle + d.endAngle) * 90 / Math.PI - 90;
                return a > 90 ? a - 180 : a;
            }



        }

        
        function DrawBackground() {
            var backRect = new Array();
            var backCoord = [[37.4249, 126.76], [37.4249, 127.1855], [37.704, 127.1855], [37.704, 126.76], [37.4249, 126.76]];
            for (var i = 0 ; i < backCoord.length ; i++) {
                backRect.push([backCoord[i][1], backCoord[i][0]]);
            }

            map.addSource("background", {
                type: "geojson",
                data: { type: "Feature", properties: {}, geometry: { type: "Polygon", coordinates: [backRect] } }
            });
            map.addLayer({
                id: "background-fill",
                type: "fill",
                source: "background",
                paint: { "fill-color": "#ffffff", "fill-opacity": 0.8 }
            });
        }

        function DrawPolygon() {

            var features = new Array();

            for (var index = 0 ; index < data.length ; index++) {

                var datum = data[index];

                var polygonCoords = new Array();

                for (var i = 0 ; i < datum.length ; i++) {
                    polygonCoords.push([datum[i].lng, datum[i].lat]);
                }

                features.push({
                    type: "Feature",
                    properties: { fillColor: dataColor[index][0], fillOpacity: Number(dataColor[index][1]) },
                    geometry: { type: "Polygon", coordinates: [polygonCoords] }
                });
            }

            map.addSource("cells", { type: "geojson", data: { type: "FeatureCollection", features: features } });

            map.addLayer({
                id: "cells-fill",
                type: "fill",
                source: "cells",
                paint: {
                    "fill-color": ["to-color", ["get", "fillColor"]],
                    "fill-opacity": ["get", "fillOpacity"]
                }
            });

            map.addLayer({
                id: "cells-line",
                type: "line",
                source: "cells",
                paint: { "line-color": "#909090", "line-opacity": 0.5, "line-width": 0.3 }
            });
        }

        function ReReadSites() {

            var cnt = 0;
            for (var i = 0; i < sites.length; i++) {

                for (var j = 0 ; j < sites[i].length ; j++) {

                    data[cnt] = new Array();

                    for (var k = 0 ; k < sites[i][j].length ; k++) {

                        data[cnt].push(new Data(sites[i][j][k][1], sites[i][j][k][0]));
                    }
                    cnt++;
                }
            }; 

            
        }


        function ReReadColors() {

            var cnt = 0;
            for (var i = 0; i < colors.length; i++) {

                for (var j = 0 ; j < colors[i].length ; j++) {

                    dataColor[cnt] = new Array();

                    dataColor[cnt][0] = colors[i][j][0];
                    dataColor[cnt][1] = colors[i][j][1];
                    
                    cnt++;
                }
            };

           
        }


    </script>

    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        svg {

            position: absolute;
            top: 60px;
            left: 100px;
            z-index: 5;

        }


         #map-canvas, #map_canvas {
            height: 100%;
        }
        

        @media print {
            html, body {
                height: auto;
            }

            #map-canvas, #map_canvas {
                height: 650px;
            }
        }
        #panel {
        position: absolute;
        top: 5px;
        left: 50%;
        margin-left: -180px;
        z-index: 5;
        background-color: #fff;
        padding: 5px;
        border: 1px solid #999;

      }

        #donutchart {
        position: absolute;
        top: 20px;
        left: 100px;
       
        z-index: 5;
        background-color: #fff;   
      }

        svg text {
            font-family: 돋움체,Arial;         
            fill : #ffffff;
            font-weight : bold;
                        
        }

        svg path {
            stroke: #fff;
        }

        #title {
            position: absolute;
        top: 20px;
        left: 115px;
        font-family: 돋움,Arial;  
        font-size : 28px;
       font-weight : bold;
        z-index: 5;
        
        }
    </style>   


</head>

<body onload="initialize()">
    
    <div id="map_canvas" ></div>
    
		
</body>
</html>
